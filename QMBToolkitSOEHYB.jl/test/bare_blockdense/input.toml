[model]
beta = 10.0
file_path = "."  
hopping_file = "hopping.txt"
interaction_file = "Uijkl.txt"
hybridization_poles_file = "hyb_poles.txt"
hybridization_weights_file = "hyb_weights.txt"

[solver]
output_path = "."
Hilbert_space_format = "blockdense"
batch_size = 5000000

[solver.propagator]
is_bold = false
expansion_order = 2

[solver.green]
is_bold = false
expansion_order = 3
save_linear_size = 1001

[solver.dlr]
Euv = 500.0
rtol = 1e-14

